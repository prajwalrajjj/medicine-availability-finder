# Render Blueprint — API + PostgreSQL (frontend lives on GitHub Pages)
services:
  - type: web
    name: medicine-availability-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run db:generate && npx prisma migrate deploy --schema=../db/prisma/schema.prisma
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: POSTGRES_URL
        fromDatabase:
          name: medicine-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://prajwalrajjj.github.io

databases:
  - name: medicine-db
    plan: free
