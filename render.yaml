# Render Blueprint — free-tier demo (API + PostgreSQL + static frontend)
# After pushing to GitHub: https://dashboard.render.com/select-repo?type=blueprint
services:
  - type: web
    name: medicine-availability-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run db:generate && npx prisma migrate deploy --schema=../db/prisma/schema.prisma
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: POSTGRES_URL
        fromDatabase:
          name: medicine-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://medicine-availability-finder.onrender.com

  - type: web
    name: medicine-availability-finder
    runtime: static
    plan: free
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: client/dist
    envVars:
      - key: VITE_API_URL
        value: https://medicine-availability-api.onrender.com

databases:
  - name: medicine-db
    plan: free
